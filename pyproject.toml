[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-deepfake-detector"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchaudio",
    "pytorch-lightning",
    "torchmetrics",
    "nnAudio",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "librosa",
    "soxr",
    "matplotlib",
    "tqdm",
    "huggingface-hub",
    "datasets",
    "aiohttp",
    "python-dotenv",
    "jupyter",
    "ipykernel",
    "lightning",
]

[project.optional-dependencies]
scraping = ["pyautogui", "pynput"]

[tool.setuptools.packages.find]
include = ["src*"]
